name: Deploy to ConoHa Wing

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.py'
      - '**.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo -e "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Verify SSH key format
        run: |
          echo "First line:"
          head -n 1 ~/.ssh/id_rsa
          echo "Last line:"
          tail -n 1 ~/.ssh/id_rsa
          echo "Total lines:"
          wc -l ~/.ssh/id_rsa
      
      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful'"
      
      - name: Deploy to ConoHa Wing via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: ./
          remote_path: /public_html/202511050046535v438e.conohawing.com/wp-content/themes/infinity-design/
          sftp_only: true
          delete_remote_files: false
          args: "--exclude='.git/' --exclude='.github/' --exclude='*.py' --exclude='*.yml' --exclude='README.md' --exclude='.DS_Store'"
      
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
