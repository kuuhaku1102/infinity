name: Deploy to ConoHa Wing

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.py'
      - '**.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to ConoHa Wing
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.py' \
            --exclude='*.yml' \
            --exclude='README.md' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/public_html/202511050046535v438e.conohawing.com/wp-content/themes/infinity-design/
      
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
