name: Deploy to ConoHa Wing

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.py'
      - '**.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Test SSH Connection
        run: |
          echo "Testing SSH connection..."
          ssh -v -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful' && pwd && ls -la"
      
      - name: Test rsync availability
        run: |
          echo "Testing rsync on remote server..."
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "which rsync && rsync --version" || echo "rsync not available on server"
      
      - name: Deploy to ConoHa Wing
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.py' \
            --exclude='*.yml' \
            --exclude='README.md' \
            -e "ssh -v -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/public_html/202511050046535v438e.conohawing.com/wp-content/themes/infinity-design/
      
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
