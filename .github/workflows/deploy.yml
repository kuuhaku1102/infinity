name: Deploy to ConoHa Wing

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.py'
      - '**.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to ConoHa Wing via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: ./
          remote_path: /home/c8321079/public_html/202511050046535v438e.conohawing.com/wp-content/themes/infinity-design/
          sftp_only: true
          delete_remote_files: false
          args: "--exclude='.git/' --exclude='.github/' --exclude='*.py' --exclude='*.yml' --exclude='README.md' --exclude='.DS_Store'"
